name: Codecov

on:
  pull_request:
    branches: [main, v1]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.prettierrc'
      - '.prettierignore'
      - 'public/resume/**'
      - 'plans/**'
  push:
    branches: [main, v1]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.prettierrc'
      - '.prettierignore'
      - 'public/resume/**'
      - 'plans/**'

permissions:
  contents: read

concurrency:
  group: codecov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: CI=true npm test -- --watchAll=false --passWithNoTests --coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

      - uses: codecov/codecov-action@v7
        if: always()
        with:
          directory: coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
