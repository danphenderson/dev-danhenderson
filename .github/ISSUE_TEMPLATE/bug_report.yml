name: Bug report
description: Report a reproducible problem with the site, build, or CI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please share enough detail for maintainers to reproduce the issue.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the repository or site is affected?
      options:
        - Home (/)
        - CV (/cv)
        - Climbing (/climbing)
        - Photography (/photography)
        - Build/CI
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What went wrong?
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the route, action, and any relevant setup.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or environment
      description: Include browser/device details or local/CI environment when relevant.
      placeholder: Chrome 123 on macOS 14 / GitHub Actions / local Node 20
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Paste error output or drag screenshots here if they help explain the issue.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched for existing issues before opening this report.
          required: true

